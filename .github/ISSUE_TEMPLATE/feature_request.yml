name: Feature request
description: Propose a focused integration or analysis improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What authorization review or integration problem is difficult today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed developer experience
      description: Show a small API or CLI example when possible.
    validations:
      required: true

  - type: dropdown
    id: certainty
    attributes:
      label: Static-analysis certainty
      description: How reliably could this be detected?
      options:
        - Deterministic AST evidence
        - High-confidence heuristic
        - Uncertain or exploratory
    validations:
      required: true

  - type: textarea
    id: casl
    attributes:
      label: CASL relationship
      description: Explain whether CASL already solves the evaluation part.
